<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmark Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #0a0c0f;
    --surface:    #111418;
    --border:     #1e2329;
    --border2:    #2a3140;
    --go:         #00acd7;
    --cpp:        #659ad2;
    --python:     #ffd43b;
    --go-dim:     #00acd740;
    --cpp-dim:    #659ad240;
    --python-dim: #ffd43b40;
    --text:       #e8eaed;
    --muted:      #6b7685;
    --accent:     #00acd7;
    --red:        #ff6b6b;
    --green:      #51cf66;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--text);
  }
  header .pipe { color: var(--border2); }
  .tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--border);
    color: var(--muted);
  }
  .tag.go     { background: #00acd715; color: var(--go);  border: 1px solid #00acd730; }
  .tag.cpp    { background: #659ad215; color: var(--cpp); border: 1px solid #659ad230; }
  .tag.python { background: #ffd43b15; color: var(--python);  border: 1px solid #ffd43b30; }

  .load-btn {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
  }
  .load-btn:hover { border-color: var(--accent); color: var(--text); }
  #file-input { display: none; }

  /* ── DROP ZONE ── */
  #drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: calc(100vh - 57px);
    border: 2px dashed var(--border2);
    margin: 24px;
    border-radius: 8px;
    transition: border-color .2s, background .2s;
    cursor: pointer;
  }
  #drop-zone.drag-over { border-color: var(--accent); background: #00acd708; }
  #drop-zone svg { opacity: .3; }
  #drop-zone p { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  #drop-zone small { color: var(--border2); font-family: var(--mono); font-size: 11px; }
  .or-btn {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 20px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
    margin-top: 4px;
  }
  .or-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ── MAIN LAYOUT ── */
  #main { display: none; }

  /* ── SUMMARY STRIP ── */
  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-cell {
    background: var(--surface);
    padding: 16px 24px;
  }
  .stat-cell .label { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .stat-cell .value { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .stat-cell .value.go      { color: var(--go); }
  .stat-cell .value.cpp     { color: var(--cpp); }
  .stat-cell .value.python  { color: var(--python); }
  .stat-cell .value.neutral { color: var(--text); }

  /* ── CONTROLS ── */
  .control-split {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .ctrl-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-right: 4px;
  }
  .btn-group {
    display: flex; gap: 4px;
  }
  .ctrl-btn {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
  }
  .ctrl-btn:hover { border-color: var(--border2); color: var(--text); }
  .ctrl-btn.active { background: var(--border); color: var(--text); border-color: var(--border2); }
  .divider { width: 1px; height: 20px; background: var(--border2); margin: 0 8px; }

  /* ── OVERVIEW CHART ── */
  .overview-section {
    padding: 28px 28px 0;
  }
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .overview-chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 20px 12px;
  }
  .overview-chart-wrap canvas { max-height: 280px; }

  /* ── GRID OF PER-BENCHMARK CHARTS ── */
  .grid-section { padding: 28px; }
  .bench-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }
  .bench-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px 12px;
    transition: border-color .15s;
  }
  .bench-card:hover { border-color: var(--border2); }
  .bench-card-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }
  .bench-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .bench-category {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .winner-badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
  }
  .winner-badge.go      { background: #00acd715; color: var(--go);  border: 1px solid #00acd730; }
  .winner-badge.cpp     { background: #659ad215; color: var(--cpp); border: 1px solid #659ad230; }
  .winner-badge.python  { background: #ffd43b15; color: var(--python);  border: 1px solid #ffd43b30; }
  .bench-canvas-wrap { position: relative; height: 120px; }
  .bench-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 4px;
    margin-top: 12px;
  }
  .bstat {
    background: var(--bg);
    border-radius: 4px;
    padding: 6px 8px;
  }
  .bstat .bl { font-family: var(--mono); font-size: 10px; margin-bottom: 3px; }
  .bstat .bv { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .bstat .bs { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .bstat.go      .bl { color: var(--go); }
  .bstat.cpp     .bl { color: var(--cpp); }
  .bstat.python  .bl { color: var(--python); }

  /* ── SPEEDUP TABLE ── */
  .table-section { padding: 0 28px 28px; }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  thead th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 12px 18px;
    text-align: left;
    font-weight: 500;
  }
  thead th:not(:first-child) { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #ffffff04; }
  tbody td {
    font-family: var(--mono);
    font-size: 12px;
    padding: 11px 18px;
    color: var(--text);
  }
  tbody td:not(:first-child) { text-align: right; }
  .td-bench { color: var(--text); font-weight: 500; }
  .td-go      { color: var(--go);  }
  .td-cpp     { color: var(--cpp); }
  .td-python  { color: var(--python);  }
  .td-speedup { color: var(--muted); }
  .td-speedup.fast { color: var(--green); }
  .td-speedup.slow { color: var(--red); }
  .td-speedup.med  { color: var(--python); }
  .td-skip { color: var(--border2); }

  /* ── FILTER INPUT ── */
  #filter-input {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 4px;
    outline: none;
    width: 180px;
    margin-left: 8px;
    transition: border-color .15s;
  }
  #filter-input::placeholder { color: var(--muted); }
  #filter-input:focus { border-color: var(--accent); }

  /* ── INTERNAL OVERVIEW — one chart-card per benchmark ── */
  .internal-overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .internal-overview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px 10px;
  }
  .internal-overview-card .ioc-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .internal-overview-card .ioc-title .ioc-cat {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 400;
  }
  .ioc-canvas-wrap { position: relative; }

  /* ── INTERNAL TABLES — stacked per-benchmark ── */
  .internal-tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .internal-table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .internal-table-card .itc-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .internal-table-card .itc-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .internal-table-card .itc-cat {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .internal-table-card table { width: 100%; border-collapse: collapse; }
  .internal-table-card thead th {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 8px 14px;
    text-align: left;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .internal-table-card thead th:not(:first-child) { text-align: right; }
  .internal-table-card tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  .internal-table-card tbody tr:last-child { border-bottom: none; }
  .internal-table-card tbody tr:hover { background: #ffffff04; }
  .internal-table-card tbody td {
    font-family: var(--mono);
    font-size: 12px;
    padding: 9px 14px;
    color: var(--text);
  }
  .internal-table-card tbody td:not(:first-child) { text-align: right; }
  .itc-winner { color: var(--text); font-weight: 500; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── FADE IN ── */
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .bench-card { animation: fadeUp .25s ease both; }
</style>
</head>
<body>

<header>
  <h1>bench<span class="pipe">/</span>viz</h1>
  <span class="tag go">Go</span>
  <span class="tag cpp">C++</span>
  <span class="tag python">Python</span>
  <span id="run-meta" class="tag" style="display:none"></span>
  <button class="load-btn" onclick="document.getElementById('file-input').click()">Load JSON ↑</button>
  <input type="file" id="file-input" accept=".json">
</header>

<!-- DROP ZONE -->
<div id="drop-zone">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/>
    <polyline points="9 15 12 12 15 15"/>
  </svg>
  <p>Drop benchmark JSON here</p>
  <small>output from benchmark.go</small>
  <button class="or-btn" onclick="loadDemo()">Load demo data</button>
</div>

<!-- MAIN DASHBOARD -->
<div id="main">
  <!-- Summary strip -->
  <div class="summary-strip" id="summary-strip"></div>

  <!-- Controls -->
  <div class="control-split">
    <div class="controls">
      <span class="ctrl-label">metric</span>
      <div class="btn-group">
        <button class="ctrl-btn active" data-metric="exec_mean_s" onclick="setMetric(this,'exec_mean_s')">execution</button>
        <button class="ctrl-btn" data-metric="compile_s" onclick="setMetric(this,'compile_s')">compile</button>
        <button class="ctrl-btn" data-metric="total_s" onclick="setMetric(this,'total_s')">total</button>
      </div>
      <div class="divider"></div>
      <span class="ctrl-label">scale</span>
      <div class="btn-group">
        <button class="ctrl-btn active" onclick="setScale(this,'linear')">linear</button>
        <button class="ctrl-btn" onclick="setScale(this,'logarithmic')">log</button>
      </div>
      <div class="divider"></div>
      <span class="ctrl-label">view</span>
      <div class="btn-group">
        <button class="ctrl-btn active" id="btn-multi"    onclick="setView(this,'multi')">multi-lang</button>
        <button class="ctrl-btn"        id="btn-internal" onclick="setView(this,'internal')">go variants</button>
      </div>
    </div>
    <div>
      <span class="ctrl-label">FILTER TESTS</span>
      <input id="filter-input" placeholder="TEST NAME" name="filter"/>
    </div>
  </div>

  <!-- Overview chart -->
  <div class="overview-section" id="overview-section">
    <div class="section-title" id="overview-title">overview — all benchmarks</div>
    <div id="overview-content"></div>
  </div>

  <!-- Per-benchmark grid -->
  <div class="grid-section">
    <div class="section-title">per benchmark</div>
    <div class="bench-grid" id="bench-grid"></div>
  </div>

  <!-- Speedup / comparison tables -->
  <div class="table-section" id="table-section">
    <div class="section-title" id="table-title">speedup table — execution time vs Python</div>
    <div id="table-content"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let DATA = null;
let metric = 'exec_mean_s';
let scaleType = 'linear';
let filterQuery = '';
let viewMode = 'multi';   // 'multi' | 'internal'
let overviewChart = null;
const miniCharts = {};
const internalOverviewCharts = {};

const LANG_COLOR = { go: '#00acd7', 'c++': '#659ad2', python: '#ffd43b' };

const PALETTE = ['#00acd7', '#f97316', '#a78bfa', '#34d399', '#fb7185', '#facc15', '#38bdf8', '#4ade80'];

const _paletteCache = {};
function paletteColor(benchName, testName, alpha) {
  const key = benchName + '|' + testName;
  if (_paletteCache[key] === undefined) {
    const siblings = DATA[benchName].results.map(r => r.test_name);
    _paletteCache[key] = siblings.indexOf(testName) % PALETTE.length;
  }
  const hex = PALETTE[_paletteCache[key]];
  return alpha ? hex + alpha : hex;
}

function colorFor(benchName, r, alpha) {
  if (viewMode === 'internal') return paletteColor(benchName, r.test_name, alpha);
  return alpha ? (LANG_COLOR[r.language] || '#888888') + alpha
               : (LANG_COLOR[r.language] || '#888888');
}

function labelFor(r) {
  return viewMode === 'internal' ? r.test_name : r.language;
}

// Chart.js global defaults
Chart.defaults.color = '#6b7685';
Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 11;

// ── File loading ───────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    readFile(file);
  }
});

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) {
    readFile(file);
  }
});
dz.addEventListener('click', () => document.getElementById('file-input').click());

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      loadData(json);
    } catch(err) {
      alert('Invalid JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ── Process data ───────────────────────────────────────────────────────────────
function processData(raw) {
  const byBench = {};
  for (const b of raw.benchmarks) {
    byBench[b.name] = b;
  }
  return byBench;
}

function loadData(raw) {
  DATA = processData(raw);
  Object.keys(_paletteCache).forEach(k => delete _paletteCache[k]);
  const ts   = raw.timestamp ? new Date(raw.timestamp * 1000).toISOString().slice(0,10) : '—';
  const runs = raw.runs_per_benchmark || '?';
  document.getElementById('run-meta').textContent = `${ts} · ${runs} runs`;
  document.getElementById('run-meta').style.display = '';
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  renderAll();
}

// ── Demo data (the actual run) ─────────────────────────────────────────────────
function loadDemo() {
  const demo = {
    timestamp: 1779833849,
    runs_per_benchmark: 2,
    benchmarks: [
      { name:'fibonacci_iter',  internal:false, category:'cpu',  results:[
          {test_name:'goSrc',     language:'go',     compile_s:8.474858, exec_mean_s:0.001088, exec_min_s:0.000955, exec_max_s:0.001221, total_s:8.475946, skipped:false},
          {test_name:'cppSrc',   language:'c++',    compile_s:0.356077, exec_mean_s:0.002729, exec_min_s:0.002625, exec_max_s:0.002834, total_s:0.358806, skipped:false},
          {test_name:'pythonSrc',language:'python', compile_s:0,        exec_mean_s:0.013887, exec_min_s:0.013572, exec_max_s:0.014203, total_s:0.013887, skipped:false},
      ]},
      { name:'fibonacci_rec',   internal:false, category:'cpu',  results:[
          {test_name:'goSrc',     language:'go',     compile_s:0.147961, exec_mean_s:1.463849, exec_min_s:1.462645, exec_max_s:1.465054, total_s:1.611811, skipped:false},
          {test_name:'cppSrc',   language:'c++',    compile_s:0.300205, exec_mean_s:0.457804, exec_min_s:0.455857, exec_max_s:0.459750, total_s:0.758008, skipped:false},
          {test_name:'pythonSrc',language:'python', compile_s:0,        exec_mean_s:28.822549,exec_min_s:28.4796,  exec_max_s:29.1655,  total_s:28.822549,skipped:false},
      ]},
      { name:'prime_sieve',     internal:false, category:'cpu',  results:[
          {test_name:'goSrc',     language:'go',     compile_s:0.156287, exec_mean_s:0.025204, exec_min_s:0.024735, exec_max_s:0.025674, total_s:0.181492, skipped:false},
          {test_name:'cppSrc',   language:'c++',    compile_s:0.327557, exec_mean_s:0.026570, exec_min_s:0.026174, exec_max_s:0.026967, total_s:0.354127, skipped:false},
          {test_name:'pythonSrc',language:'python', compile_s:0,        exec_mean_s:0.061477, exec_min_s:0.061067, exec_max_s:0.061887, total_s:0.061477, skipped:false},

// ── Helpers ────────────────────────────────────────────────────────────────────
function fmtTime(s) {
  if (s == null || s < 0) {
    return '—';
  }
  if (s < 0.001) {
    return (s * 1000).toFixed(3) + ' ms';
  }
  if (s < 1) {
    return (s * 1000).toFixed(1) + ' ms';
  }
  return s.toFixed(3) + ' s';
}

function winner(benchName) {
  let best = null, bestT = Infinity;
  for (const r of DATA[benchName].results) {
    if (!r.skipped && r.exec_mean_s < bestT) {
      bestT = r.exec_mean_s;
      best = r;
    }
  }
  return best;
}

function filteredBenches() {
  const q = filterQuery.trim().toLowerCase();
  const isInternal = viewMode === 'internal';
  return Object.keys(DATA).filter(b => {
    if (DATA[b].internal !== isInternal) {
      return false;
    }
    return !q || b.toLowerCase().includes(q);
  });
}

// ── renderAll ─────────────────────────────────────────────────────────────────
function renderAll() {
  Object.keys(_paletteCache).forEach(k => delete _paletteCache[k]);
  renderSummary();
  renderOverview();
  renderGrid();
  renderTable();
}

// ── Summary strip ──────────────────────────────────────────────────────────────
function renderSummary() {
  const benches = filteredBenches();
  const strip = document.getElementById('summary-strip');

  if (viewMode === 'internal') {
    const cells = benches.map(b => {
      const w = winner(b);
      const ci = w ? DATA[b].results.findIndex(r => r.test_name === w.test_name) % PALETTE.length : 0;
      const color = w ? PALETTE[ci] : '#6b7685';
      return `<div class="stat-cell">
        <div class="label">${b.replace(/_/g,' ')}</div>
        <div class="value" style="color:${color};font-size:15px">${w ? w.test_name : '—'} <span style="font-size:12px;color:var(--muted)">${w ? fmtTime(w.exec_mean_s) : ''}</span></div>
      </div>`;
    });
    strip.innerHTML = cells.join('') ||
      `<div class="stat-cell"><div class="label">no variant benchmarks</div></div>`;
    return;
  }

  const totals = {};
  for (const b of benches)
    for (const r of DATA[b].results)
      if (!r.skipped) {
        totals[r.language] = (totals[r.language] || 0) + r.exec_mean_s;
      }
  const pyT  = totals['python'] || 0;
  const goT  =totals['go']      || 0;
  const cppT =totals['c++']     || 0;
  strip.innerHTML = [
    { label:'go total exec',     value: fmtTime(goT),                           cls:'go'     },
    { label:'c++ total exec',    value: fmtTime(cppT),                          cls:'cpp'    },
    { label:'python total exec', value: fmtTime(pyT),                           cls:'python' },
    { label:'go avg speedup',    value: goT  ? (pyT/goT ).toFixed(1)+'×' : '—', cls:'go'     },
    { label:'c++ avg speedup',   value: cppT ? (pyT/cppT).toFixed(1)+'×' : '—', cls:'cpp'    },
    { label:'benchmarks',        value: benches.length,                         cls:'neutral'},
  ].map(c => `<div class="stat-cell"><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`).join('');
}

// ── Overview ───────────────────────────────────────────────────────────────────
function renderOverview() {
  // destroy old charts
  if (overviewChart) { overviewChart.destroy(); overviewChart = null; }
  Object.keys(internalOverviewCharts).forEach(k => { internalOverviewCharts[k].destroy(); delete internalOverviewCharts[k]; });

  const content = document.getElementById('overview-content');
  const title   = document.getElementById('overview-title');
  content.innerHTML = '';

  if (viewMode === 'internal') {
    title.textContent = 'per benchmark — variant comparison';
    renderInternalOverview(content);
  } else {
    title.textContent = 'overview — all benchmarks';
    renderMultiOverview(content);
  }
}

function renderMultiOverview(container) {
  const benches = filteredBenches();
  const wrap = document.createElement('div');
  wrap.className = 'overview-chart-wrap';
  const canvas = document.createElement('canvas');
  canvas.id = 'overview-chart';
  wrap.appendChild(canvas);
  container.appendChild(wrap);

  const datasets = ['go','c++','python'].map(lang => ({
    label: lang === 'python' ? 'Python' : lang === 'c++' ? 'C++' : 'Go',
    data: benches.map(b => {
      const r = DATA[b].results.find(x => x.language === lang);
      return r && !r.skipped ? parseFloat((r[metric] || 0).toFixed(6)) : 0;
    }),
    backgroundColor: (LANG_COLOR[lang] || '#888') + '80',
    borderColor: LANG_COLOR[lang] || '#888',
    borderWidth: 1,
    borderRadius: 3,
    borderSkipped: false,
  }));

  overviewChart = new Chart(canvas, {
    type: 'bar',
    data: { labels: benches.map(b => b.replace(/_/g,' ')), datasets },
    options: {
      responsive:true, maintainAspectRatio:true,
      plugins: {
        legend: { position:'top', labels:{ boxWidth:10, padding:16, font:{size:11} } },
        tooltip: { callbacks:{ label: c => ` ${c.dataset.label}: ${fmtTime(c.raw)}` } },
      },
      scales: {
        x: { ticks:{maxRotation:25}, grid:{color:'#1e232940'} },
        y: {
          type:scaleType,
          title: {
            display:true,
            text:'seconds',
            font:{size:11}
          },
          grid:{color:'#1e232980'},
          ticks:{callback:v=>fmtTime(v)}
        },
      },
    },
  });
}

function renderInternalOverview(container) {
  const benches = filteredBenches();
  if (!benches.length) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-family:var(--mono)">no variant benchmarks match filter</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'internal-overview-grid';
  container.appendChild(grid);

  benches.forEach(b => {
    const results    = DATA[b].results.filter(r => !r.skipped);
    const cat        = DATA[b].category || '';
    const canvasH    = Math.max(120, results.length * 32 + 32);

    const card = document.createElement('div');
    card.className = 'internal-overview-card';
    card.innerHTML = `
      <div class="ioc-title">
        ${b.replace(/_/g,'_\u200b')}
        <span class="ioc-cat">${cat}</span>
      </div>
      <div class="ioc-canvas-wrap" style="height:${canvasH}px">
        <canvas id="ioc-${b}"></canvas>
      </div>`;
    grid.appendChild(card);

    const ctx = card.querySelector(`#ioc-${b}`);
    // Sort by exec time descending so fastest is at top of horizontal bar
    const sorted = [...results].sort((a,b) => b[metric] - a[metric]);

    internalOverviewCharts[b] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: sorted.map(r => r.test_name),
        datasets: [{
          data:            sorted.map(r => parseFloat((r[metric] || 0).toFixed(6))),

          },
          y: {
            grid:{display:false},
            ticks:{font:{size:11}}
          },
        },
      },
    });
  });
}

// ── Per-benchmark card grid ────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('bench-grid');
  grid.innerHTML = '';
  const benches = filteredBenches();
  benches.forEach((b, idx) => {
    const results  = DATA[b].results;
    const cat      = DATA[b].category || 'misc';
    const w        = winner(b);
    const wLabel   = w ? labelFor(w) : null;
    const wColor   = w ? colorFor(b, w) : null;
    const wBadge   = wLabel
      ? `<span class="winner-badge" style="background:${wColor}15;color:${wColor};border:1px solid ${wColor}50">${wLabel} fastest</span>`
      : '';

    // speedup baseline: slowest result (internal) or Python result (multi)
    const getBaseline = () => {
      if (viewMode === 'internal') {
        const valid = results.filter(r => !r.skipped);
        return valid.reduce((a, x) => x.exec_mean_s > a.exec_mean_s ? x : a, valid[0] || null);
      }
      return results.find(r => r.language === 'python') || null;
    };
    const baseline = getBaseline();

    const statsHtml = results.map(r => {
      const v   = !r.skipped ? fmtTime(r.exec_mean_s) : '—';
      const lbl = labelFor(r);
      const col = colorFor(b, r);

      let speedupHtml = '<div class="bs">&nbsp;</div>';
      if (!r.skipped && baseline && !baseline.skipped && r !== baseline && r.test_name !== baseline.test_name && baseline.exec_mean_s > 0) {
        const ratio = baseline.exec_mean_s / r.exec_mean_s;
        const sign  = ratio >= 1 ? 'faster' : 'slower';
        speedupHtml = `<div class="bs">${ratio.toFixed(1)}× ${sign}</div>`;
      }

      return `<div class="bstat" style="background:var(--bg)">
        <div class="bl" style="color:${col}">${lbl}</div>
        <div class="bv">${v}</div>
        ${speedupHtml}
      </div>`;
    }).join('');

    // mini chart height scales with result count
    const miniH = Math.max(100, results.length * 22);

    const card = document.createElement('div');
    card.className = 'bench-card';
    card.style.animationDelay = (idx * 30) + 'ms';
    card.innerHTML = `
      <div class="bench-card-header">
        <span class="bench-name">${b.replace(/_/g,'_\u200b')}</span>
        <span class="bench-category">${cat}</span>
        ${wBadge}
      </div>
      <div class="bench-canvas-wrap" style="height:${miniH}px"><canvas id="mini-${b}"></canvas></div>
      <div class="bench-stats">${statsHtml}</div>`;
    grid.appendChild(card);

    const ctx = card.querySelector(`#mini-${b}`);
    if (miniCharts[b]) miniCharts[b].destroy();
    miniCharts[b] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels:  results.map(r => labelFor(r)),
        datasets: [{
          data:            results.map(r => r.skipped ? 0 : parseFloat((r.exec_mean_s||0).toFixed(6))),
          backgroundColor: results.map(r => colorFor(b, r, '70')),
          borderColor:     results.map(r => colorFor(b, r)),
          borderWidth:1, borderRadius:3, borderSkipped:false,
        }],
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => ` ${fmtTime(c.raw)}` } }
        },
        scales: {
          x: { grid: { display: false },
          ticks: { font: { size: 10 } }
        },
          y: {
            type: scaleType,
            grid: { color: '#1e232980' },
            ticks: {
              callback: v => fmtTime(v),
              font: { size: 10 }
            }
          },
        },
      },
    });
  });
}

// ── Table ──────────────────────────────────────────────────────────────────────
function renderTable() {
  const content = document.getElementById('table-content');
  const title   = document.getElementById('table-title');
  content.innerHTML = '';

  if (viewMode === 'internal') {
    title.textContent = 'comparison tables — vs slowest variant';
    renderInternalTables(content);
  } else {
    title.textContent = 'speedup table — execution time vs Python';
    renderMultiTable(content);
  }
}

function renderMultiTable(container) {
  const benches = filteredBenches();

  function speedupClass(v) {
    if (!v)    return 'td-skip';
    if (v>=10) return 'td-speedup fast';
    if (v>=2)  return 'td-speedup med';
    if (v<1)   return 'td-speedup slow';
    return 'td-speedup';
  }

  const rows = benches.map(b => {
    const results = DATA[b].results;
    const go  = results.find(r => r.language === 'go');
    const cpp = results.find(r => r.language === 'c++');
    const py  = results.find(r => r.language === 'python');
    const pyT = py  && !py.skipped  ? py.exec_mean_s  : null;
    const goT = go  && !go.skipped  ? go.exec_mean_s  : null;
    const cppT= cpp && !cpp.skipped ? cpp.exec_mean_s : null;
    const goX = pyT && goT  ? pyT/goT  : null;
    const cppX= pyT && cppT ? pyT/cppT : null;
    const w   = winner(b);
    const wLang = w ? w.language : null;
    return `<tr>
      <td class="td-bench">${b}</td>
      <td class="td-python">${pyT  ? fmtTime(pyT)  : '<span class="td-skip">—</span>'}</td>
      <td class="td-go">${    goT  ? fmtTime(goT)  : '<span class="td-skip">—</span>'}</td>
      <td class="td-cpp">${   cppT ? fmtTime(cppT) : '<span class="td-skip">—</span>'}</td>
      <td class="${speedupClass(goX)}">${goX  ? goX.toFixed(1)+'×'  : '—'}</td>
      <td class="${speedupClass(cppX)}">${cppX ? cppX.toFixed(1)+'×' : '—'}</td>
      <td class="td-${wLang === 'c++' ? 'cpp' : wLang||''}">${wLang||'—'}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>benchmark</th>
          <th style="color:var(--python)">python</th>
          <th style="color:var(--go)">go</th>
          <th style="color:var(--cpp)">c++</th>
          <th>go speedup</th>
          <th>c++ speedup</th>
          <th>winner</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderInternalTables(container) {
  const benches = filteredBenches();
  if (!benches.length) return;

  const grid = document.createElement('div');
  grid.className = 'internal-tables-grid';
  container.appendChild(grid);

  benches.forEach(b => {
    const results = DATA[b].results;
    const cat     = DATA[b].category || '';
    const valid   = results.filter(r => !r.skipped);
    const slowest = valid.reduce((a, x) => x.exec_mean_s > a.exec_mean_s ? x : a, valid[0] || null);
    const w       = winner(b);

    const rows = valid
      .slice()
      .sort((a, z) => a.exec_mean_s - z.exec_mean_s)  // fastest first
      .map((r, rank) => {
        const ci    = DATA[b].results.findIndex(x => x.test_name === r.test_name) % PALETTE.length;
        const color = PALETTE[ci];
        const vsSlowRatio = slowest && slowest.exec_mean_s > 0
          ? (slowest.exec_mean_s / r.exec_mean_s)
          : null;
        const speedupColor = vsSlowRatio == null ? 'var(--muted)'
          : vsSlowRatio >= 3 ? 'var(--green)'
          : vsSlowRatio >= 1.5 ? 'var(--python)'
          : 'var(--muted)';

        return `<tr>
          <td style="display:flex;align-items:center;gap:8px">
            <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${color};flex-shrink:0"></span>
            <span style="color:${color};font-weight:600">${r.test_name}</span>
          </td>
          <td>${fmtTime(r.exec_mean_s)}</td>
          <td style="color:var(--muted);font-size:11px">${fmtTime(r.exec_min_s)} – ${fmtTime(r.exec_max_s)}</td>
          <td style="color:${speedupColor}">${vsSlowRatio != null ? vsSlowRatio.toFixed(1)+'×' : '—'}</td>
        </tr>`;
      }).join('');

    const card = document.createElement('div');
    card.className = 'internal-table-card';
    card.innerHTML = `
      <div class="itc-header">
        <span class="itc-name">${b.replace(/_/g,'_\u200b')}</span>
        <span class="itc-cat">${cat}</span>
        ${w ? `<span class="winner-badge" style="margin-left:auto;background:${paletteColor(b,w.test_name)}15;color:${paletteColor(b,w.test_name)};border:1px solid ${paletteColor(b,w.test_name)}50">${w.test_name}</span>` : ''}
      </div>
      <table>
        <thead><tr>
          <th style="text-align:left">variant</th>
          <th>mean</th>
          <th>min – max</th>
          <th>vs slowest</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    grid.appendChild(card);
  });
}

// ── Controls ───────────────────────────────────────────────────────────────────
function setMetric(btn, m) {
  metric = m;
  document.querySelectorAll('[data-metric]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!DATA) {
    return;
  }
  renderOverview();
  renderGrid();
}

function setScale(btn, s) {
  scaleType = s;
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    if (b.getAttribute('onclick')?.includes('setScale')) b.classList.remove('active');
  });
  btn.classList.add('active');
  if (!DATA) {
    return;
  }
  renderOverview();
  renderGrid();
}

function setView(btn, mode) {
  viewMode = mode;
  document.getElementById('btn-multi').classList.toggle('active',    mode === 'multi');
  document.getElementById('btn-internal').classList.toggle('active', mode === 'internal');
  if (!DATA) {
    return;
  }
  renderAll();
}

document.getElementById('filter-input').addEventListener('input', e => {
  filterQuery = e.target.value;
  if (!DATA) {
    return;
  }
  renderOverview();
  renderGrid();
  renderTable();
  renderSummary();
});
</script>
</body>
</html>
